<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PhosphorWatch</title>
<style>
/*__FONT__*/
/*__THEME__*/
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
#app { position: relative; height: 100%; display: flex; flex-direction: column; background: var(--bg); }
main { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px; }
main::-webkit-scrollbar { width: 4px; }
main::-webkit-scrollbar-thumb { background: var(--dim); }
.label { color: var(--dim); }
.row { display: flex; gap: 6px; align-items: center; }
.row .pw-input { flex: 1; min-width: 0; }
.err { color: var(--late); min-height: 1em; text-shadow: none; }
#favs { display: flex; flex-direction: column; }
.fav { display: flex; align-items: center; gap: 0; padding: 0 0 0 2px; border-bottom: 1px solid var(--glow); }
.fav .name { flex: 1; min-width: 0; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  color: var(--mid); padding: 2px 0; font-size: var(--fs-big); }
.fav .name::before { content: "> "; color: var(--dim); }
.fav:hover .name { color: var(--fg); }
.fav .pw-btn { visibility: hidden; }
.fav:hover .pw-btn { visibility: visible; }
.empty { color: var(--dim); }
.who { color: var(--dim); display: flex; gap: 8px; align-items: center; justify-content: space-between; margin-top: auto; padding-top: 4px; }
.who b { color: var(--mid); font-weight: normal; }
.who .link { color: var(--mid); cursor: pointer; }
.who .link:hover { color: var(--fg); }
</style>
</head>
<body>
<div id="app">
  <main class="pw-scanned">
    <div>
      <div class="label">TUNE CHANNEL</div>
      <div class="row">
        <input class="pw-input" id="chan" placeholder="channel or twitch.tv link" spellcheck="false" autocomplete="off">
        <button class="pw-tbtn" id="go" title="Watch">WATCH</button>
        <button class="pw-btn" id="fav" title="Add to favorites"></button>
      </div>
      <div class="err" id="err"></div>
    </div>
    <div>
      <div class="label">FAVORITES</div>
      <div id="favs"></div>
    </div>
    <div class="who" id="who"></div>
  </main>
</div>

<script>
/*__CHROME__*/

(function () {
  var $ = function (id) { return document.getElementById(id); };
  var app = $("app"), main = app.querySelector("main"), api = null, st = null;
  $("fav").innerHTML = pwIcon("plus");

  var ui = pwMount({ box: app, overlay: false, onState: render });
  app.insertBefore(app.querySelector(".pw-bar"), main);   // header above the content

  function favBtn(icon, title, fn, cls) {
    var b = document.createElement("button");
    b.className = "pw-btn" + (cls ? " " + cls : ""); b.title = title; b.innerHTML = pwIcon(icon);
    b.onclick = function (e) { e.stopPropagation(); fn(); };
    return b;
  }

  function renderFavs() {
    var box = $("favs"); box.innerHTML = "";
    if (!st.favorites.length) {
      box.innerHTML = '<div class="empty">none yet: type a channel, press +</div>';
      return;
    }
    st.favorites.forEach(function (name) {
      var row = document.createElement("div"); row.className = "fav";
      var n = document.createElement("span"); n.className = "name"; n.textContent = name.toUpperCase();
      n.title = "Watch " + name;
      n.onclick = function () { watch(name); };
      row.appendChild(n);
      row.appendChild(favBtn("up", "Move up", function () { api.move_favorite(name, -1); }));
      row.appendChild(favBtn("down", "Move down", function () { api.move_favorite(name, 1); }));
      row.appendChild(favBtn("close", "Remove", function () { api.remove_favorite(name); }, "x"));
      box.appendChild(row);
    });
  }

  function render(s) {
    var first = !st;
    st = s; api = ui.api();
    if (first && s.last_channel) { $("chan").value = s.last_channel; $("chan").select(); }
    renderFavs();
    var who = $("who"); who.innerHTML = "";
    var left = document.createElement("span"), link = document.createElement("span");
    link.className = "link";
    if (s.user) {
      left.innerHTML = "SIGNED IN: <b></b>"; left.querySelector("b").textContent = s.user.toUpperCase();
      link.textContent = "SIGN OUT"; link.onclick = function () { api.logout(); };
    } else {
      left.textContent = "NOT SIGNED IN";
      link.textContent = "SIGN IN TO TWITCH >"; link.onclick = function () { api.login(); };
    }
    who.appendChild(left); who.appendChild(link);
  }

  function watch(text) {
    $("err").textContent = "";
    ui.api().watch(text).then(function (r) { if (!r.ok) $("err").textContent = r.error; });
  }

  $("go").onclick = function () { watch($("chan").value); };
  $("chan").addEventListener("keydown", function (e) { if (e.key === "Enter") watch($("chan").value); });
  $("fav").onclick = function () {
    var v = $("chan").value;
    ui.api().add_favorite(v).then(function (r) { $("err").textContent = r.ok ? "" : r.error; });
  };
  $("chan").focus();
})();
</script>
</body>
</html>
